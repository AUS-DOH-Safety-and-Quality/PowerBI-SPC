name: Deploy Quarto site to Pages

on:
  push:
    branches: ["main"]
    paths:
      - docs/** # Push events to docs folder

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    uses: AUS-DOH-Safety-and-Quality/PowerBI-Visuals-Core/.github/workflows/deploy_docs.yml@main
